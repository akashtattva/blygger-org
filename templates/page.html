<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><circle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23d95a1f%22/></svg>">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<header class="site-header">
  <a class="wordmark" href="/"><span class="dot"></span>blygger</a>
  <nav class="site-nav" aria-label="Site">
    <a href="/start/">start</a>
    <a href="{{SPEC_LINK}}">spec</a>
    <a href="/notes/">notes</a>
    <a href="/ecosystem/">ecosystem</a>
    <a href="/talks/2026-09-24-blygger/">talk</a>
    <a href="https://github.com/blygger">github</a>
    <a href="https://blygger.com">blygger.com</a>
  </nav>
</header>

<div class="layout">
  <aside class="rail">
    <p class="rail-label">{{RAIL_LABEL}}</p>
    <ol>
{{RAIL_ITEMS}}
    </ol>
  </aside>
  <main class="content">
    <div class="prompt">{{PROMPT}}</div>
{{CONTENT}}
  </main>
</div>

<!-- Contents drawer for tablet/mobile. Same items as the sticky rail;
     CSS shows this below 860px and keeps the rail for desktop. -->
<div class="jump-links">
  <button
    type="button"
    class="jump-links-trigger"
    data-jump-links-open
    aria-expanded="false"
    aria-controls="jump-links-drawer"
  >
    <span>Contents</span>
    <svg
      class="jump-links-chevron"
      viewBox="0 0 16 16"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="m3 10 5-5 5 5" />
    </svg>
  </button>
  <div
    class="jump-links-scrim"
    data-jump-links-scrim
    aria-hidden="true"
  ></div>
  <nav
    id="jump-links-drawer"
    class="jump-links-drawer"
    data-jump-links
    aria-label="{{RAIL_LABEL}}"
    inert
  >
    <div class="jump-links-body">
      <div class="jump-links-header" data-jump-links-grip>
        <p class="jump-links-title">{{RAIL_LABEL}}</p>
        <button
          type="button"
          class="jump-links-close"
          data-jump-links-close
        >
          Close
        </button>
      </div>
      <ol class="jump-links-list">
{{RAIL_ITEMS}}
      </ol>
    </div>
  </nav>
</div>

<footer class="site-footer">
  MIT (code) &middot; CC-BY-4.0 (docs) &middot;
  <a href="https://github.com/blygger/blygger-spec">blygger-spec</a> &middot;
  this domain is the protocol's namespace host &mdash;
  <a href="https://blygger.com">blygger.com</a> is its commercial-adjacent sibling.
</footer>
<script src="/jump-links.js" defer></script>
</body>
</html>
